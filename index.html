<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flex Shell v9.0 Diagnostic Suite</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141822;
      --border: #222a3d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --pass: #10b981;
      --fail: #ef4444;
      --warn: #f59e0b;
      --blue: #3b82f6;
      --purple: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 16px;
      padding-bottom: 40px;
      line-height: 1.4;
      font-size: 13px;
    }

    header {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .subhead { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

    /* Summary Bar */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 16px;
    }
    .metric-val { font-size: 1.3rem; font-weight: 800; }
    .metric-lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }

    /* Action Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:active { opacity: 0.8; }
    button.btn-purple { background: var(--purple); }
    button.btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    button.btn-danger { background: var(--fail); }

    /* Test Categories & Items */
    .category-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--blue);
      margin: 18px 0 8px;
      display: flex;
      justify-content: space-between;
    }
    .test-list { display: flex; flex-direction: column; gap: 6px; }
    .test-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .test-info { flex: 1; overflow: hidden; }
    .test-name { font-weight: 600; font-size: 0.82rem; }
    .test-detail { font-size: 0.72rem; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .badge {
      font-size: 0.68rem;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--pass); }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--fail); }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
    .badge-idle { background: rgba(148, 163, 184, 0.15); color: var(--muted); }

    /* Live Event Terminal */
    .terminal-card {
      background: #06080d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 20px;
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    #event-feed {
      height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-row { display: flex; gap: 6px; }
    .log-ts { color: var(--muted); flex-shrink: 0; }
    .log-ev { color: var(--warn); font-weight: 700; }
    .log-data { color: #cbd5e1; word-break: break-all; }
  </style>
</head>
<body>

  <header>
    <h1>Flex Shell v9.0 Diagnostics</h1>
    <div class="subhead">Contract Validation Engine • TwoWebViews Architecture</div>
  </header>

  <div class="summary-card">
    <div>
      <div class="metric-val" id="cnt-total">0</div>
      <div class="metric-lbl">Total</div>
    </div>
    <div>
      <div class="metric-val" style="color:var(--pass);" id="cnt-pass">0</div>
      <div class="metric-lbl">Passed</div>
    </div>
    <div>
      <div class="metric-val" style="color:var(--fail);" id="cnt-fail">0</div>
      <div class="metric-lbl">Failed</div>
    </div>
    <div>
      <div class="metric-val" style="color:var(--warn);" id="cnt-warn">0</div>
      <div class="metric-lbl">Pending</div>
    </div>
  </div>

  <div class="btn-row">
    <button onclick="Runner.runAll()">▶ Run All Contract Tests</button>
    <button class="btn-secondary" onclick="Runner.clearResults()">Reset</button>
  </div>

  <div class="category-title">Interactive Shell Triggers</div>
  <div class="btn-row">
    <button class="btn-purple" onclick="Triggers.testOpenSite()">Open Site (browse)</button>
    <button class="btn-purple" onclick="Triggers.testSetFab()">Deploy FAB</button>
    <button class="btn-purple" onclick="Triggers.testToggleImmersive()">Toggle Immersive</button>
    <button class="btn-secondary" onclick="Triggers.testFetchAsync()">Test fetchAsync()</button>
  </div>

  <div id="results-container"></div>

  <!-- Realtime Native Event Bus Monitor -->
  <div class="terminal-card">
    <div class="terminal-header">
      <span style="font-weight:700; font-size:0.75rem; text-transform:uppercase; color:var(--muted);">Live Native Events Bus (Section 4)</span>
      <button class="btn-secondary" style="padding:2px 8px; font-size:0.7rem;" onclick="Terminal.clear()">Clear</button>
    </div>
    <div id="event-feed">
      <div style="color:var(--muted); font-style:italic;">Listening for native events...</div>
    </div>
  </div>

  <script>
    /**
     * SECTION 4: GLOBAL EVENT LISTENER SUITE
     * Hooks into all 20 native window.dispatchEvent hooks defined in contract v9.0
     */
    const Terminal = {
      feed: document.getElementById('event-feed'),
      init() {
        const events = [
          'siteState', 'fabTapped', 'overlayHidden', 'autoPlayStarted', 'mediaDetected',
          'playerState', 'playbackProgress', 'playbackEnded', 'queueItemChanged',
          'tracksChanged', 'pipChanged', 'ON_PLAYBACK_ERROR', 'downloadProgress',
          'downloadPaused', 'downloadResumed', 'downloadCancelled', 'downloadComplete',
          'downloadError', 'mediaDeleted', 'networkChange', 'vpnStatus'
        ];

        events.forEach(eventName => {
          window.addEventListener(eventName, (e) => {
            this.log(eventName, e.detail);
          });
        });
      },
      log(ev, detail) {
        if (this.feed.children[0] && this.feed.children[0].textContent.includes('Listening')) {
          this.feed.innerHTML = '';
        }
        const row = document.createElement('div');
        row.className = 'log-row';
        const ts = new Date().toTimeString().split(' ')[0];
        row.innerHTML = `
          <span class="log-ts">[${ts}]</span>
          <span class="log-ev">${ev}:</span>
          <span class="log-data">${detail ? JSON.stringify(detail) : '{}'}</span>
        `;
        this.feed.appendChild(row);
        this.feed.scrollTop = this.feed.scrollHeight;
      },
      clear() {
        this.feed.innerHTML = '<div style="color:var(--muted); font-style:italic;">Listening for native events...</div>';
      }
    };

    /**
     * INTERACTIVE WORKBENCH TRIGGERS
     */
    const Triggers = {
      testOpenSite() {
        if (!window.NativeApp || !window.NativeApp.openSite) return alert("NativeApp.openSite not available.");
        window.NativeApp.openSite("https://example.com");
      },
      testSetFab() {
        if (!window.NativeApp || !window.NativeApp.setFab) return alert("NativeApp.setFab not available.");
        window.NativeApp.setFab(JSON.stringify({
          visible: true,
          size: 56,
          bgColor: "#3b82f6",
          iconColor: "#ffffff",
          badge: "1"
        }));
        alert("FAB payload dispatched. Switch to 'browse' mode (openSite) to view it.");
      },
      testToggleImmersive() {
        if (!window.NativeApp || !window.NativeApp.setImmersive) return alert("NativeApp.setImmersive not available.");
        this.isImm = !this.isImm;
        window.NativeApp.setImmersive(this.isImm);
      },
      async testFetchAsync() {
        if (!window.NativeApp || !window.NativeApp.fetchAsync) return alert("NativeApp.fetchAsync not available.");
        try {
          const res = await Runner.flexFetch("https://httpbin.org/get");
          alert("fetchAsync Success! Status: " + res.status);
        } catch(e) {
          alert("fetchAsync Failed: " + e.message);
        }
      }
    };

    /**
     * DIAGNOSTIC TEST RUNNER & CONTRACT VALIDATOR
     */
    const Runner = {
      tests: [
        /* 1. Bridge & Core Capabilities */
        {
          cat: "Bridge Detection & Hardware Capabilities",
          name: "window.NativeApp Injected",
          fn: () => typeof window.NativeApp !== 'undefined' && window.NativeApp !== null
        },
        {
          cat: "Bridge Detection & Hardware Capabilities",
          name: "getCapabilities() Schema",
          fn: () => {
            const res = JSON.parse(window.NativeApp.getCapabilities());
            return res && res.shellVersion === "9.0-TwoWebViews";
          }
        },
        {
          cat: "Bridge Detection & Hardware Capabilities",
          name: "getSafeInsets() Notch Metrics",
          fn: () => {
            const res = JSON.parse(window.NativeApp.getSafeInsets());
            return res && typeof res.top === 'number' && typeof res.bottom === 'number';
          }
        },
        {
          cat: "Bridge Detection & Hardware Capabilities",
          name: "setSystemBars() Invocation",
          fn: () => {
            window.NativeApp.setSystemBars(JSON.stringify({ color: "#0b0d12", darkIcons: false, navColor: "#000000" }));
            return true;
          }
        },

        /* 2. Two-WebView & Navigation */
        {
          cat: "Two-WebView Architecture (Section 3.1 & 3.2)",
          name: "getSiteState() Synchronous Schema",
          fn: () => {
            const s = JSON.parse(window.NativeApp.getSiteState());
            return s && typeof s.canGoBack === 'boolean' && typeof s.loading === 'boolean';
          }
        },
        {
          cat: "Two-WebView Architecture (Section 3.1 & 3.2)",
          name: "setFab() Payload Handler",
          fn: () => {
            window.NativeApp.setFab(JSON.stringify({ visible: false, size: 56, bgColor: "#2563EB", badge: "0" }));
            return true;
          }
        },
        {
          cat: "Two-WebView Architecture (Section 3.1 & 3.2)",
          name: "Navigation Control Signatures",
          fn: () => {
            return typeof window.NativeApp.openSite === 'function' &&
                   typeof window.NativeApp.closeSite === 'function' &&
                   typeof window.NativeApp.siteBack === 'function' &&
                   typeof window.NativeApp.siteForward === 'function' &&
                   typeof window.NativeApp.siteReload === 'function' &&
                   typeof window.NativeApp.siteStop === 'function';
          }
        },
        {
          cat: "Two-WebView Architecture (Section 3.1 & 3.2)",
          name: "Overlay Mode Signatures",
          fn: () => typeof window.NativeApp.showOverlay === 'function' && typeof window.NativeApp.hideOverlay === 'function'
        },

        /* 3. Advanced Fetch (CORS Bypass) */
        {
          cat: "Network Layer & CORS Engine (Section 3.4)",
          name: "Callback Registry window.__flexFetchCb",
          fn: () => {
            window.__flexFetchCb = window.__flexFetchCb || {};
            return typeof window.__flexFetchCb === 'object';
          }
        },
        {
          cat: "Network Layer & CORS Engine (Section 3.4)",
          name: "fetchAsync() UI-Thread Callback Return",
          fn: async () => {
            const res = await Runner.flexFetch("manifest.json");
            return res && (res.status === 200 || typeof res.body === 'string');
          }
        },

        /* 4. Embedded Player (Zero Native UI) */
        {
          cat: "Embedded Player Control (Section 3.5)",
          name: "getPlayerState() State Retrieval",
          fn: () => {
            const s = JSON.parse(window.NativeApp.getPlayerState());
            return s && typeof s.playing === 'boolean' && typeof s.positionMs === 'number';
          }
        },
        {
          cat: "Embedded Player Control (Section 3.5)",
          name: "playerControl() Command Pipeline",
          fn: () => {
            window.NativeApp.playerControl(JSON.stringify({ cmd: "pause" }));
            return true;
          }
        },
        {
          cat: "Embedded Player Control (Section 3.5)",
          name: "getTracks() Track Schema",
          fn: () => {
            const t = JSON.parse(window.NativeApp.getTracks());
            return t && Array.isArray(t.video) && Array.isArray(t.audio) && Array.isArray(t.text);
          }
        },
        {
          cat: "Embedded Player Control (Section 3.5)",
          name: "Device Brightness & Volume Hardware",
          fn: () => {
            const b = window.NativeApp.getBrightness();
            const v = window.NativeApp.getSystemVolume();
            return typeof b === 'number' && typeof v === 'number';
          }
        },
        {
          cat: "Embedded Player Control (Section 3.5)",
          name: "setSubtitleStyle() Handler",
          fn: () => {
            window.NativeApp.setSubtitleStyle(JSON.stringify({ size: 16, color: "#FFFFFF", backgroundColor: "#00000000" }));
            return true;
          }
        },
        {
          cat: "Embedded Player Control (Section 3.5)",
          name: "setVideoLayout() Matrix Engine",
          fn: () => {
            window.NativeApp.setVideoLayout(JSON.stringify({ mode: "fit", scale: 1.0, panX: 0.0, panY: 0.0 }));
            return true;
          }
        },

        /* 5. Playback Persistence */
        {
          cat: "Playback Persistence (Section 3.6)",
          name: "getAllPlaybackState() Schema",
          fn: () => {
            const all = JSON.parse(window.NativeApp.getAllPlaybackState());
            return Array.isArray(all);
          }
        },

        /* 6. Media3 Downloader */
        {
          cat: "Media3 Downloader & Local Storage (Section 3.7)",
          name: "listDownloads() Queue Reader",
          fn: () => {
            const dl = JSON.parse(window.NativeApp.listDownloads());
            return Array.isArray(dl);
          }
        },
        {
          cat: "Media3 Downloader & Local Storage (Section 3.7)",
          name: "listMedia() Offline Inventory",
          fn: () => {
            const m = JSON.parse(window.NativeApp.listMedia());
            return Array.isArray(m);
          }
        },
        {
          cat: "Media3 Downloader & Local Storage (Section 3.7)",
          name: "getStorageInfo() Partition Metrics",
          fn: () => {
            const s = JSON.parse(window.NativeApp.getStorageInfo());
            return s && typeof s.freeBytes === 'number';
          }
        },

        /* 7. WireGuard App-Only VPN */
        {
          cat: "WireGuard VPN Subsystem (Section 3.8)",
          name: "getVpnStatus() Tunnel State",
          fn: () => {
            const st = JSON.parse(window.NativeApp.getVpnStatus());
            return st && typeof st.state === 'string' && typeof st.hasConfig === 'boolean';
          }
        },
        {
          cat: "WireGuard VPN Subsystem (Section 3.8)",
          name: "setVpnKillSwitch() Control",
          fn: () => {
            window.NativeApp.setVpnKillSwitch(false);
            return true;
          }
        },

        /* 8. Web Filtering & Shell Environment */
        {
          cat: "Web Filtering, Sniffer & Environment (Section 3.9)",
          name: "updateAdBlockRules() Rule Ingestion",
          fn: () => {
            window.NativeApp.updateAdBlockRules(JSON.stringify(["doubleclick.net", "popads.net"]));
            return true;
          }
        },
        {
          cat: "Web Filtering, Sniffer & Environment (Section 3.9)",
          name: "updateSniffPatterns() Sniffer Setup",
          fn: () => {
            window.NativeApp.updateSniffPatterns(JSON.stringify([".m3u8", ".mp4", ".mpd"]));
            return true;
          }
        },
        {
          cat: "Web Filtering, Sniffer & Environment (Section 3.9)",
          name: "getNotificationPrefs() Schema",
          fn: () => {
            const n = JSON.parse(window.NativeApp.getNotificationPrefs());
            return n && typeof n.downloadProgress === 'boolean';
          }
        }
      ],

      async flexFetch(url, opts = {}) {
        return new Promise((resolve, reject) => {
          const absoluteUrl = new URL(url, window.location.href).href;
          const callbackId = 'cb_' + Date.now() + '_' + Math.random().toString(36).substring(2);

          const timeout = setTimeout(() => {
            delete window.__flexFetchCb[callbackId];
            reject(new Error("Timed out after 10s"));
          }, 10000);

          window.__flexFetchCb = window.__flexFetchCb || {};
          window.__flexFetchCb[callbackId] = (resultObj) => {
            clearTimeout(timeout);
            delete window.__flexFetchCb[callbackId];
            resolve(typeof resultObj === 'string' ? JSON.parse(resultObj) : resultObj);
          };

          const payload = JSON.stringify({
            url: absoluteUrl,
            method: opts.method || 'GET',
            headers: opts.headers || {},
            body: opts.body || '',
            timeout: 30000
          });

          window.NativeApp.fetchAsync(payload, callbackId);
        });
      },

      initUI() {
        const container = document.getElementById('results-container');
        container.innerHTML = '';
        let currentCat = '';
        let catDiv = null;

        this.tests.forEach((t, i) => {
          if (t.cat !== currentCat) {
            currentCat = t.cat;
            const h = document.createElement('div');
            h.className = 'category-title';
            h.textContent = currentCat;
            container.appendChild(h);

            catDiv = document.createElement('div');
            catDiv.className = 'test-list';
            container.appendChild(catDiv);
          }

          const el = document.createElement('div');
          el.className = 'test-item';
          el.id = `test-row-${i}`;
          el.innerHTML = `
            <div class="test-info">
              <div class="test-name">${t.name}</div>
              <div class="test-detail" id="test-detail-${i}">Waiting...</div>
            </div>
            <span class="badge badge-idle" id="test-badge-${i}">IDLE</span>
          `;
          catDiv.appendChild(el);
        });

        document.getElementById('cnt-total').textContent = this.tests.length;
      },

      async runAll() {
        if (!window.NativeApp) {
          alert("window.NativeApp is not detected. Ensure you are running inside the Flex Shell WebView.");
        }

        let p = 0, f = 0;
        document.getElementById('cnt-pass').textContent = '0';
        document.getElementById('cnt-fail').textContent = '0';
        document.getElementById('cnt-warn').textContent = this.tests.length;

        for (let i = 0; i < this.tests.length; i++) {
          const t = this.tests[i];
          const badge = document.getElementById(`test-badge-${i}`);
          const detail = document.getElementById(`test-detail-${i}`);

          badge.className = 'badge badge-warn';
          badge.textContent = 'RUN';

          try {
            const ok = await t.fn();
            if (ok) {
              badge.className = 'badge badge-pass';
              badge.textContent = 'PASS';
              detail.textContent = 'Contract requirements satisfied';
              p++;
            } else {
              badge.className = 'badge badge-fail';
              badge.textContent = 'FAIL';
              detail.textContent = 'Returned unexpected data format';
              f++;
            }
          } catch(err) {
            badge.className = 'badge badge-fail';
            badge.textContent = 'ERROR';
            detail.textContent = err.message || 'Threw unexpected exception';
            f++;
          }

          document.getElementById('cnt-pass').textContent = p;
          document.getElementById('cnt-fail').textContent = f;
          document.getElementById('cnt-warn').textContent = (this.tests.length - (p + f));
        }
      },

      clearResults() {
        this.initUI();
        document.getElementById('cnt-pass').textContent = '0';
        document.getElementById('cnt-fail').textContent = '0';
        document.getElementById('cnt-warn').textContent = '0';
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      Terminal.init();
      Runner.initUI();
    });
  </script>
</body>
</html>
