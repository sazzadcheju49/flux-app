<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; media-src 'self' https: data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<title>Flex</title>
<style>
:root{--ac:#2563eb;--bg:#0f1115;--cd:#181b21;--tx:#e8eaed;--mu:#8a909b;--bd:#2a2e38;--sat:0px;--sab:0px}
html[data-theme=light]{--bg:#ffffff;--cd:#f1f3f6;--tx:#14171c;--mu:#5d6572;--bd:#dfe3e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
html.clear,html.clear body{background:transparent!important}
html.clear #app{display:none}
#app{height:100%;display:flex;flex-direction:column}
#view{flex:1;overflow:auto;padding:16px}
h2{margin:0 0 12px;font-size:20px}
.mu{color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
button,input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin:3px 3px 3px 0}
button.p{background:var(--ac);color:#fff;border:0}
button.r{background:#7f1d1d;color:#fff;border:0}
input[type=url],input[type=text]{width:100%}
input[type=checkbox]{width:18px;height:18px;padding:0;vertical-align:middle}
input[type=color]{padding:0;height:38px;width:60px}
input[type=range]{padding:0}
progress{width:100%;height:8px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--cd);border-radius:10px;padding:8px;font-size:12px;max-height:180px;overflow:auto}
.screen{display:none}.screen.on{display:block}
#tabs{display:flex;border-top:1px solid var(--bd);background:var(--bg)}
#tabs button{flex:1;margin:0;border:0;border-radius:0;background:transparent;padding:14px 4px;color:var(--mu)}
#tabs button.on{color:var(--ac);font-weight:600}
html.m-sheet #tabs{display:none}
#sheetbar{display:none;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}
html.m-sheet #sheetbar{display:flex}
#banner{margin:12px;padding:12px;border-radius:12px;background:#7c2d12;color:#fff;font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,22,26,.95);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:99;max-width:86%;font-size:14px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:50}
html.m-overlay #ov{display:block}
#ovbar{position:absolute;left:8px;right:8px;bottom:12px;background:rgba(24,27,33,.96);border-radius:16px;padding:10px;color:#e8eaed}
#ovbar button{background:#2a2e38;color:#e8eaed;border:0}
#ovbar button.p{background:var(--ac);color:#fff}
#ovinfo{font-size:12px;color:#8a909b;margin-bottom:6px;word-break:break-all}
#hud{display:none;position:fixed;inset:0;z-index:60;user-select:none;-webkit-user-select:none;touch-action:none}
html.m-player #hud{display:block}
.hb{position:absolute;left:0;right:0;background:rgba(0,0,0,.55);padding:8px 12px;color:#fff}
.hb button{background:rgba(255,255,255,.14);color:#fff;border:0}
#hudtop{top:0;display:flex;justify-content:space-between;align-items:center;padding-top:calc(max(var(--sat),env(safe-area-inset-top,0px)) + 8px)}
#hudbot{bottom:0;padding-bottom:calc(max(var(--sab),env(safe-area-inset-bottom,0px)) + 8px)}
#hudmid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#hudmid button{font-size:28px;border-radius:50%;width:64px;height:64px;background:rgba(0,0,0,.55);color:#fff;border:0}
#hudind{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:6px 14px;font-size:16px;display:none;max-width:90%;text-align:center}
#hud.hide .hb,#hud.hide #hudmid{display:none}
#hudrow{display:flex;align-items:center;gap:8px;color:#fff}
#hudrow input{flex:1;margin:0}
</style>
</head>
<body>
<div id="app">
<div id="sheetbar"><b id="sheettitle"></b><button id="sheetclose" class="p">Close</button></div>
<div id="banner" hidden><div id="bannertext"></div><div><button id="bretry" class="p">Retry startup</button><button id="bskip">Skip that step from now on</button></div></div>
<main id="view">
<section class="screen on" id="s-movies">
<h2>Movies</h2>
<p class="mu">Movies and series arrive in the next stage. Test browsing for now:</p>
<div class="card"><input type="url" id="testUrl"><button class="p" id="openTest">Open site</button></div>
</section>
<section class="screen" id="s-downloads"><h2>Downloads</h2><div id="dlist"></div></section>
<section class="screen" id="s-settings">
<h2>Settings</h2>
<div class="card"><b>Theme</b><br><button id="thDark">Dark</button><button id="thLight">Light</button><br>Accent <input type="color" id="accent"></div>
<div class="card"><label><input type="checkbox" id="autoplay"> Play videos in the native player automatically</label><br><label><input type="checkbox" id="priv"> Private mode (clear site cookies, cache and history when a site closes)</label></div>
<div class="card"><b>Diagnostics</b><br><a href="diagnostics.html" style="color:var(--ac)">Open diagnostics page</a><br><button id="showCrash">Show last crash</button><button id="clearCrash">Clear crash</button><pre id="crashinfo">Tap "Show last crash"</pre></div>
</section>
</main>
<nav id="tabs"><button data-t="movies">Movies</button><button data-t="downloads">Downloads</button><button data-t="settings">Settings</button></nav>
</div>

<div id="ov"><div id="ovbar">
<div id="ovinfo">No site yet</div>
<div id="ovmedia" hidden><button class="p" id="ovplay">▶ Play</button><button id="ovdl">⬇ Download</button></div>
<div>
<button data-o="back">◀</button><button data-o="fwd">▶</button><button data-o="reload">⟳</button><button data-o="home">⌂ Home</button><button data-o="search">Search</button><button data-o="dl">Downloads</button><button data-o="set">Settings</button><button data-o="bm">Bookmarks</button><button class="r" data-o="close">Close</button>
</div>
</div></div>

<div id="hud">
<div class="hb" id="hudtop"><span id="hudt">Playing</span><span><button id="hdl">⬇</button><button id="hx">✕ Close</button></span></div>
<div id="hudmid"><button id="hpp">⏸</button></div>
<div id="hudind"></div>
<div class="hb" id="hudbot">
<div id="hudrow"><span id="ht">0:00</span><input type="range" id="hs" min="0" max="1000" value="0"><span id="hd">0:00</span></div>
<div><button data-h="-10">⏪10</button><button data-h="10">10⏩</button><button id="hsp">1x</button><button id="hlay">fit</button><button id="hau">Audio</button><button id="hsu">Subs</button><button id="hpip">PiP</button><button id="hor">Rotate</button></div>
</div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),J=JSON.stringify,N=window.NativeApp,root=document.documentElement;
const parse=v=>{if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return v}}return v};
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?Object.assign({},d,v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,typeof v==='string'?v:J(v))}catch(e){}};
const S=lsGet('flexSettings',{theme:'dark',accent:'#2563eb',autoplay:true,private:false,testUrl:'https://cinejoy.pk'});
const saveS=()=>lsSet('flexSettings',S);
let skipList=[];try{skipList=JSON.parse(localStorage.getItem('flexSkip')||'[]')}catch(e){}
const fmt=ms=>{const s=Math.max(0,Math.floor((ms||0)/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let toastT=null;
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display='none'},2800)}
const NOLOG={getPlayerState:1,getBrightness:1,getSystemVolume:1,getSiteState:1};
function sh(n,...a){if(!N||typeof N[n]!=='function')return undefined;try{if(!NOLOG[n])localStorage.setItem('flexLastCall',n+' '+new Date().toISOString());return N[n](...a)}catch(e){toast('Native call failed: '+n);return undefined}}
window.__flexFetchCb=function(id,res){const f=window.__flexFetchCb[id];if(typeof f==='function'){delete window.__flexFetchCb[id];f(parse(res))}};

/* defaults used when the repo files are missing */
const DEF_RULES=['doubleclick.net','pyppo.com','adsystem','/ads/'];
const DEF_CSS='.ad,.ads,[id^="ad-"]{display:none!important}';
const DEF_HOOK='(function(){if(window.__flexHook)return;window.__flexHook=1;function rep(u,d){try{FlexSiteBridge.reportMedia(JSON.stringify({url:String(u).slice(0,700),pageUrl:location.href.slice(0,200),durationSec:d||0}))}catch(e){}}function chk(v){var u=v.currentSrc||v.src;if(u&&u.indexOf("blob:")!==0&&(!v.duration||!isFinite(v.duration)||v.duration>60))rep(u,v.duration)}document.addEventListener("play",function(e){if(e.target&&e.target.tagName==="VIDEO")chk(e.target)},true);document.addEventListener("loadedmetadata",function(e){if(e.target&&e.target.tagName==="VIDEO")chk(e.target)},true)})();';
const SNIFF=['.m3u8','.mp4','.mpd','.mkv','.webm','.mp3','.m4a'];
async function getText(p,def){try{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw 0;const t=await r.text();return t.trim()?t:def}catch(e){return def}}

/* theme */
const bgColor=()=>S.theme==='light'?'#ffffff':'#0f1115';
function applyTheme(){root.dataset.theme=S.theme;root.style.setProperty('--ac',S.accent);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=bgColor()}
function applyBars(){const c=bgColor();sh('setSystemBars',J({color:c,darkIcons:S.theme==='light',navColor:c,gradient:{from:S.theme==='light'?'#F2FFFFFF':'#F20F1115',to:'#00000000',extraDp:24}}))}
function mkIcon(){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');x.fillStyle='#fff';x.beginPath();x.moveTo(34,24);x.lineTo(34,72);x.lineTo(74,48);x.closePath();x.fill();return c.toDataURL('image/png')}
let iconURL='';
function refreshFab(badge){if(!iconURL)iconURL=mkIcon();sh('setFab',J({visible:true,size:56,bgColor:S.accent,iconColor:'#FFFFFF',icon:iconURL,badge:badge||''}))}

/* startup with crash breadcrumbs */
const STEPS=[
['bars',()=>applyBars()],
['adblock',async()=>{const t=await getText('adblock-rules.txt','');const r=t?t.split('\n').map(x=>x.trim()).filter(x=>x&&x[0]!=='#'):DEF_RULES;sh('updateAdBlockRules',J(r))}],
['cleartext',()=>sh('setAllowCleartext',false)],
['navblocking',()=>sh('setNavBlocking',J({scheme:true,adblock:true,redirectNoGesture:true}))],
['sniff',()=>sh('updateSniffPatterns',J(SNIFF))],
['autoplay',()=>sh('setAutoPlayExternal',!!S.autoplay)],
['private',()=>sh('setPrivateMode',!!S.private)],
['inject',async()=>sh('setInjectedScript',await getText('inject.js',DEF_HOOK))],
['css',async()=>sh('setCosmeticCss',await getText('cosmetic.css',DEF_CSS))],
['fab',()=>refreshFab('')]
];
async function runStartup(){for(const s of STEPS){if(skipList.indexOf(s[0])>=0)continue;lsSet('flexBoot','step:'+s[0]);try{await s[1]()}catch(e){}}lsSet('flexBoot','done')}

/* ui modes */
let ui='app',prevUi='app',ps={},lastMedia=null,curPlay=null,polling=null,seeking=false,gotVideo=false,vTimer=null,lastSiteUrl='';
function setUi(m){if(m!==ui)prevUi=ui;ui=m;root.classList.toggle('clear',m==='overlay'||m==='player');root.classList.toggle('m-overlay',m==='overlay');root.classList.toggle('m-sheet',m==='sheet');root.classList.toggle('m-player',m==='player');if(m==='player'){const i=parse(sh('getSafeInsets'));if(i&&typeof i==='object'){root.style.setProperty('--sat',i.top+'px');root.style.setProperty('--sab',i.bottom+'px')}$('hud').classList.remove('hide');startPoll()}}
function hint(t){const e=$('hudind');e.textContent=t;e.style.display=t?'block':'none'}
const ROUTES=['movies','downloads','settings'];
function showScreen(n){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id==='s-'+n));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));if(n==='downloads')renderDownloads();if(n==='settings')showCrash(true)}
function route(){const r=location.hash.replace('#/','');showScreen(ROUTES.indexOf(r)>=0?r:'movies')}
window.addEventListener('hashchange',route);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{location.hash='#/'+b.dataset.t});
function openSheet(n){showScreen(n);$('sheettitle').textContent=n==='downloads'?'Downloads':'Settings';setUi('sheet')}
$('sheetclose').onclick=()=>setUi('overlay');

/* settings */
function initSettings(){$('accent').value=S.accent;$('autoplay').checked=!!S.autoplay;$('priv').checked=!!S.private;$('testUrl').value=S.testUrl}
$('thDark').onclick=()=>{S.theme='dark';saveS();applyTheme();applyBars()};
$('thLight').onclick=()=>{S.theme='light';saveS();applyTheme();applyBars()};
$('accent').onchange=e=>{S.accent=e.target.value;saveS();applyTheme();refreshFab(lastMedia?'1':'')};
$('autoplay').onchange=e=>{S.autoplay=e.target.checked;saveS();sh('setAutoPlayExternal',S.autoplay)};
$('priv').onchange=e=>{S.private=e.target.checked;saveS();sh('setPrivateMode',S.private)};
$('openTest').onclick=()=>{const u=$('testUrl').value.trim();if(!/^https?:\/\//i.test(u))return toast('Only http and https addresses');S.testUrl=u;saveS();sh('openSite',u)};
function showCrash(quiet){const c=parse(sh('getLastCrash'));$('crashinfo').textContent='Last native call: '+(localStorage.getItem('flexLastCall')||'-')+'\n'+((!c||c==='null')?'No crash recorded':J(c,null,1));if(!quiet)toast('Updated')}
$('showCrash').onclick=()=>showCrash(false);
$('clearCrash').onclick=()=>{sh('clearLastCrash');showCrash(false)};

/* downloads */
let dlT=null;const scheduleDl=()=>{clearTimeout(dlT);dlT=setTimeout(()=>{if($('s-downloads').classList.contains('on'))renderDownloads()},800)};
function btn(label,cls,fn){const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b}
function renderDownloads(){const l=parse(sh('listDownloads'));const box=$('dlist');box.textContent='';if(!Array.isArray(l)||!l.length){const p=document.createElement('p');p.className='mu';p.textContent='No downloads yet.';box.appendChild(p);return}
l.forEach(x=>{const c=document.createElement('div');c.className='card';const t=document.createElement('div');t.textContent=x.fileName+' · '+x.state+' · '+(x.percent||0)+'%';c.appendChild(t);const p=document.createElement('progress');p.max=100;p.value=x.percent||0;c.appendChild(p);
if(x.state==='downloading')c.appendChild(btn('Pause','',()=>sh('pauseDownload',x.fileName)));
if(x.state==='paused')c.appendChild(btn('Resume','',()=>sh('resumeDownload',x.fileName)));
if(x.state!=='completed')c.appendChild(btn('Cancel','',()=>sh('cancelDownload',x.fileName)));
if(x.state==='completed'){c.appendChild(btn('Play','p',()=>play(x.url,{},{preferOffline:true})));c.appendChild(btn('Delete','r',()=>{sh('deleteMedia',x.fileName);scheduleDl()}))}
box.appendChild(c)})}
function startDownload(m){if(!m||!m.url)return toast('Nothing to download yet');const hls=/\.m3u8/i.test(m.url);const ext=(m.url.split('?')[0].match(/\.(mp4|mkv|webm|mp3|m4a)$/i)||[0,'mp4'])[1];sh('download',J({url:m.url,fileName:'flex_'+Date.now()+(hls?'.mp4':'.'+ext),type:hls?'hls':'file',maxHeight:720,audioLangs:['en'],subtitleLangs:[],headers:m.headers||{}}));toast('Download started')}

/* play and player */
const keepH=h=>{const o={};Object.keys(h||{}).forEach(k=>{if(['origin','referer','user-agent','cookie'].indexOf(k.toLowerCase())>=0)o[k]=h[k]});return o};
function play(url,headers,opts){curPlay={url:url,headers:headers||{}};sh('playStream',J(Object.assign({url:url,headers:headers||{},progressIntervalMs:500,preferredAudioLang:'en',preferredSubtitleLang:'en'},opts||{})));setUi('player')}
const pc=(cmd,value)=>sh('playerControl',J({cmd:cmd,value:value}));
function startPoll(){if(polling||!N)return;polling=setInterval(()=>{if(ui!=='player')return;const s=parse(sh('getPlayerState'));if(s&&typeof s==='object'&&s.url!==undefined){ps=s;hudUpdate()}},500)}
function hudUpdate(){const d=ps.durationMs||0,p=ps.positionMs||0;$('ht').textContent=fmt(p);$('hd').textContent=d?fmt(d):'live';if(!seeking&&d)$('hs').value=Math.round(p/d*1000);$('hpp').textContent=ps.playing?'⏸':'▶';$('hsp').textContent=(ps.speed||1)+'x';if(ps.url)$('hudt').textContent=String(ps.url).split('/').pop().split('?')[0].slice(0,30)}
function updateOvMedia(){$('ovmedia').hidden=!lastMedia}

/* events */
const EVENTS=['siteState','fabTapped','overlayHidden','autoPlayStarted','autoPlayFailed','mediaDetected','playerState','playbackProgress','pipChanged','videoReady','modeChanged','ON_PLAYBACK_ERROR','navBlocked','siteDownload','downloadRejected','downloadProgress','downloadPaused','downloadResumed','downloadCancelled','downloadComplete','downloadError','mediaDeleted'];
function onEvt(n,d){d=d||{};
if(n==='fabTapped')setUi('overlay');
else if(n==='overlayHidden')setUi('app');
else if(n==='modeChanged'){if(d.mode==='player'){if(ui!=='player')setUi('player');gotVideo=false;clearTimeout(vTimer);vTimer=setTimeout(()=>{if(!gotVideo)hint('No video frame yet. Open Settings > diagnostics > getPlayerDebug.')},8000)}else if(d.mode==='overlay'){if(ui!=='overlay'&&ui!=='sheet')setUi('overlay')}else if(d.mode==='app'){if(ui!=='app')setUi('app')}}
else if(n==='videoReady'){gotVideo=true;clearTimeout(vTimer);hint('')}
else if(n==='siteState'){$('ovinfo').textContent=(d.title||'')+' · '+(d.url||'')+(d.loading?' (loading)':'');if(d.loading&&d.url&&d.url!==lastSiteUrl){lastSiteUrl=d.url;if(lastMedia){lastMedia=null;refreshFab('')}updateOvMedia()}}
else if(n==='mediaDetected'){const u=String(d.url||'');if(/init\.mp4|\.m4s|\.ts(\?|$)|\.vtt|\.jpe?g|\.png|\.webp/i.test(u))return;const isM=/\.m3u8|\.mpd/i.test(u);if(isM||!lastMedia||!/\.m3u8|\.mpd/i.test(lastMedia.url||'')){const first=!lastMedia;d.headers=keepH(d.headers);lastMedia=d;if(first)refreshFab('1');updateOvMedia()}}
else if(n==='autoPlayStarted'){curPlay={url:d.url,headers:keepH(d.headers)}}
else if(n==='autoPlayFailed')toast('Could not play natively: '+(d.error||''));
else if(n==='ON_PLAYBACK_ERROR'){hint('Playback error: '+(d.httpStatus||d.error||''));toast('Playback error '+(d.httpStatus||d.error||''))}
else if(n==='pipChanged')$('hud').classList.toggle('hide',!!(d.inPip||d.isPip));
else if(n==='playerState'){Object.assign(ps,d);hudUpdate()}
else if(n==='playbackProgress'){ps.positionMs=d.positionMs;ps.durationMs=d.durationMs;hudUpdate()}
else if(n==='navBlocked'){if(d.reason==='ssl'||d.reason==='cleartext')toast('Blocked an insecure page ('+d.reason+')')}
else if(n==='siteDownload')toast('A site tried to start a download. Ignored.');
else if(n==='downloadRejected')toast('Blocked a dangerous download');
else if(n==='downloadError')toast('Download failed: '+(d.error||''));
else if(String(n).indexOf('download')===0||n==='mediaDeleted')scheduleDl()}
EVENTS.forEach(n=>window.addEventListener(n,e=>onEvt(n,e.detail)));
window.__flexEvent=(n,d)=>onEvt(n,parse(d));

/* overlay bar */
function closeOv(){sh('hideOverlay');setUi('app')}
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeOv()});
document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=b.dataset.o;if(o==='back')sh('siteBack');else if(o==='fwd')sh('siteForward');else if(o==='reload')sh('siteReload');else if(o==='home'){sh('closeSite');setUi('app')}else if(o==='dl')openSheet('downloads');else if(o==='set')openSheet('settings');else if(o==='close')closeOv();else toast('Coming in the next stage')});
$('ovplay').onclick=()=>{if(lastMedia)play(lastMedia.url,lastMedia.headers)};
$('ovdl').onclick=()=>startDownload(lastMedia);

/* player controls and gestures */
const ind=t=>{$('hudind').textContent=t;$('hudind').style.display=t?'block':'none'};
$('hx').onclick=()=>{pc('stop');setUi(prevUi==='player'?'app':prevUi)};
$('hdl').onclick=()=>startDownload(curPlay);
$('hpp').onclick=()=>pc(ps.playing?'pause':'play');
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>pc('seek',Math.max(0,(ps.positionMs||0)+Number(b.dataset.h)*1000)));
const SP=[0.5,1,1.25,1.5,2];$('hsp').onclick=()=>pc('speed',SP[(SP.indexOf(ps.speed||1)+1)%SP.length]);
const LY=['fit','fill','zoom'];let li=0;$('hlay').onclick=()=>{li=(li+1)%3;sh('setVideoLayout',J({mode:LY[li],scale:1,panX:0,panY:0}));$('hlay').textContent=LY[li]};
function cycleTrack(type){const t=parse(sh('getTracks'));const l=(t&&t[type])||[];if(!l.length)return ind('No '+type+' tracks');const i=l.findIndex(x=>x.selected);const n=(type==='text'&&i===l.length-1)?{id:'off',label:'off'}:l[(i+1)%l.length];sh('selectTrack',J({type:type,id:n.id}));ind(type+': '+(n.label||n.lang||n.id));setTimeout(()=>ind(''),1200)}
$('hau').onclick=()=>cycleTrack('audio');$('hsu').onclick=()=>cycleTrack('text');
$('hpip').onclick=()=>sh('enterPip');
const OR=['auto','landscape','portrait'];let oi=0;$('hor').onclick=()=>{oi=(oi+1)%3;sh('setOrientation',OR[oi]);ind('Orientation: '+OR[oi]);setTimeout(()=>ind(''),1200)};
$('hs').addEventListener('input',()=>{seeking=true;$('ht').textContent=fmt($('hs').value/1000*(ps.durationMs||0))});
$('hs').addEventListener('change',()=>{pc('seek',Math.round($('hs').value/1000*(ps.durationMs||0)));seeking=false});
(function(){const h=$('hud');let g=null,lastTap=0,tapT=null,lp=null,spd=false;
h.addEventListener('touchstart',e=>{if(e.target.closest('.hb,button,input'))return;const t=e.touches[0];g={x:t.clientX,y:t.clientY,mode:null,pos:ps.positionMs||0,dur:ps.durationMs||0,b:parseFloat(sh('getBrightness'))||0.5,v:parseFloat(sh('getSystemVolume'))||0.5,left:t.clientX<innerWidth/2};lp=setTimeout(()=>{if(g&&!g.mode){spd=true;pc('speed',2);ind('2x speed')}},500)},{passive:true});
h.addEventListener('touchmove',e=>{if(!g)return;const t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;if(!g.mode){if(Math.abs(dx)<12&&Math.abs(dy)<12)return;clearTimeout(lp);g.mode=Math.abs(dx)>Math.abs(dy)?'h':'v'}
if(g.mode==='h'&&g.dur){g.tgt=Math.max(0,Math.min(g.dur,g.pos+dx/innerWidth*120000));ind('Seek '+fmt(g.tgt)+' / '+fmt(g.dur))}
else if(g.mode==='v'){const f=-dy/(innerHeight*.7);if(g.left){const b=Math.max(0,Math.min(1,g.b+f));sh('setBrightness',b);ind('Brightness '+Math.round(b*100)+'%')}else{const v=Math.max(0,Math.min(1,g.v+f));sh('setSystemVolume',v);ind('Volume '+Math.round(v*100)+'%')}}},{passive:true});
h.addEventListener('touchend',()=>{if(!g)return;clearTimeout(lp);const gg=g;g=null;if(spd){spd=false;pc('speed',1);ind('');return}
if(gg.mode==='h'&&gg.tgt!=null){pc('seek',Math.round(gg.tgt));ind('');return}if(gg.mode==='v'){setTimeout(()=>ind(''),600);return}
const now=Date.now();if(now-lastTap<300){clearTimeout(tapT);lastTap=0;pc('seek',Math.max(0,(ps.positionMs||0)+(gg.left?-10000:10000)));ind(gg.left?'-10s':'+10s');setTimeout(()=>ind(''),600)}else{lastTap=now;tapT=setTimeout(()=>$('hud').classList.toggle('hide'),300)}},{passive:true})})();

/* boot */
(async function boot(){
applyTheme();initSettings();route();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
const prev=localStorage.getItem('flexBoot');
lsSet('flexBoot','start');
if(!N){toast('Not inside the Flex app: native features are off');lsSet('flexBoot','done');return}
if(prev&&prev!=='done'&&prev!=='start'){
const step=String(prev).replace('step:','');
$('bannertext').textContent='The last launch stopped during startup step "'+step+'". Safe mode is on: startup settings were skipped.';
$('banner').hidden=false;
$('bretry').onclick=async()=>{$('banner').hidden=true;await runStartup();toast('Startup finished')};
$('bskip').onclick=async()=>{if(skipList.indexOf(step)<0)skipList.push(step);lsSet('flexSkip',skipList);$('banner').hidden=true;await runStartup();toast('Startup finished without "'+step+'"')};
lsSet('flexBoot','done');return}
await runStartup();
})();
})();
</script>
</body>
</html>
