<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Flex App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: calc(var(--sab) + 64px);
      padding-left: var(--sal);
      padding-right: var(--sar);
      background-color: #080b12;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ========================================================
       PLACEHOLDER 1: BRIDGE ENGINE
       ======================================================== */
    const Bridge = {
      isNative: () => typeof window.NativeAppBridge !== 'undefined',

      getCapabilities: () => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.getCapabilities === 'function') {
          try {
            const raw = window.NativeAppBridge.getCapabilities();
            return typeof raw === 'string' ? JSON.parse(raw) : raw;
          } catch (err) {
            console.error('Bridge getCapabilities parse error:', err);
          }
        }
        return {
          isFallback: true,
          shellVersion: 'Browser Fallback (No Shell)',
          exoPlayer: false,
          backgroundDownloader: false,
          sdkLevel: 0
        };
      },

      fetch: async ({ url, method = 'GET', headers = {}, body = null }) => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.fetch === 'function') {
          try {
            const requestPayload = JSON.stringify({ url, method, headers, body });
            const responseStr = window.NativeAppBridge.fetch(requestPayload);
            const parsed = typeof responseStr === 'string' ? JSON.parse(responseStr) : responseStr;
            return {
              status: parsed.status || 200,
              headers: parsed.headers || {},
              body: parsed.body || ''
            };
          } catch (err) {
            console.error('Bridge native fetch error:', err);
            throw err;
          }
        }

        // Standard browser fallback
        const res = await window.fetch(url, {
          method,
          headers,
          body: body ? (typeof body === 'string' ? body : JSON.stringify(body)) : null
        });
        const text = await res.text();
        return {
          status: res.status,
          headers: Object.fromEntries(res.headers.entries()),
          body: text
        };
      },

      playStream: ({ url, userAgent = 'FlexNativePlayer/1.0', headers = {}, subtitleUrl = '', startPositionMs = 0 }) => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.playStream === 'function') {
          const payload = JSON.stringify({ url, userAgent, headers, subtitleUrl, startPositionMs });
          window.NativeAppBridge.playStream(payload);
          return true;
        }
        console.warn('NativeAppBridge.playStream unavailable. Falling back to web video player.', { url });
        return false;
      },

      startDownload: ({ url, fileName, headers = {} }) => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.startDownload === 'function') {
          const payload = JSON.stringify({ url, fileName, headers });
          window.NativeAppBridge.startDownload(payload);
          return true;
        }
        console.warn('NativeAppBridge.startDownload unavailable in browser.', { fileName, url });
        return false;
      },

      getLocalMediaFiles: () => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.getLocalMediaFiles === 'function') {
          try {
            const raw = window.NativeAppBridge.getLocalMediaFiles();
            return typeof raw === 'string' ? JSON.parse(raw) : raw;
          } catch (err) {
            console.error('Bridge getLocalMediaFiles error:', err);
            return [];
          }
        }
        return [];
      },

      deleteFile: (filePath) => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.deleteFile === 'function') {
          return window.NativeAppBridge.deleteFile(filePath);
        }
        console.warn('Bridge deleteFile called in browser mode:', filePath);
        return false;
      },

      minimizeApp: () => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.minimizeApp === 'function') {
          window.NativeAppBridge.minimizeApp();
        } else {
          console.log('Bridge minimizeApp triggered (no-op in browser).');
        }
      },

      clearCache: () => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.clearCache === 'function') {
          window.NativeAppBridge.clearCache();
        }
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (e) {}
        return true;
      },

      installApk: (apkPath) => {
        if (Bridge.isNative() && typeof window.NativeAppBridge.installApk === 'function') {
          window.NativeAppBridge.installApk(apkPath);
          return true;
        }
        console.warn('Bridge installApk called in browser:', apkPath);
        return false;
      }
    };
    /* ========================================================
       END PLACEHOLDER 1
       ======================================================== */


    /* ========================================================
       PLACEHOLDER 3: CATALOG VIEW
       ======================================================== */
    const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';

    // Curated fallback titles so catalog is never empty
    const INITIAL_CATALOG = [
      {
        id: 603,
        title: 'The Matrix',
        media_type: 'movie',
        poster_path: '/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg',
        backdrop_path: '/7u3HTrw79Gv9oE9XRO9Vep8Ie7p.jpg',
        vote_average: 8.2,
        release_date: '1999-03-30',
        overview: 'Set in the 22nd century, The Matrix tells the story of a computer hacker who joins a group of underground insurgents fighting the vast and powerful computers who now rule the earth.',
        cast: ['Keanu Reeves', 'Laurence Fishburne', 'Carrie-Anne Moss']
      },
      {
        id: 157336,
        title: 'Interstellar',
        media_type: 'movie',
        poster_path: '/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg',
        backdrop_path: '/xJHokMbljvjADYdit5fK5VQsXEG.jpg',
        vote_average: 8.4,
        release_date: '2014-11-05',
        overview: 'The adventures of a group of explorers who make use of a newly discovered wormhole to surpass the limitations on human space travel and conquer the vast distances involved in an interstellar voyage.',
        cast: ['Matthew McConaughey', 'Anne Hathaway', 'Jessica Chastain']
      },
      {
        id: 1399,
        title: 'Game of Thrones',
        name: 'Game of Thrones',
        media_type: 'tv',
        poster_path: '/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg',
        backdrop_path: '/2OMB0ynKlyIenMJWI2Dy9IWT4c.jpg',
        vote_average: 8.4,
        release_date: '2011-04-17',
        overview: 'Seven noble families fight for control of the mythical land of Westeros. Friction between the houses leads to full-scale war.',
        cast: ['Emilia Clarke', 'Kit Harington', 'Peter Dinklage'],
        seasonsCount: 8
      },
      {
        id: 66732,
        title: 'Stranger Things',
        name: 'Stranger Things',
        media_type: 'tv',
        poster_path: '/49WJfeN0moxb9IPfGn8AIqMGskD.jpg',
        backdrop_path: '/56v2KjBlU4XaOv9rVYEQypROD7P.jpg',
        vote_average: 8.6,
        release_date: '2016-07-15',
        overview: 'When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces and one strange little girl.',
        cast: ['Millie Bobby Brown', 'Finn Wolfhard', 'Winona Ryder'],
        seasonsCount: 4
      }
    ];

    function CatalogView({ onSelectMedia }) {
      const [feed, setFeed] = useState(INITIAL_CATALOG);
      const [activeDetail, setActiveDetail] = useState(null);
      const [selectedSeason, setSelectedSeason] = useState(1);
      const [selectedEpisode, setSelectedEpisode] = useState(1);
      const [continueWatching, setContinueWatching] = useState([]);
      const [filterCategory, setFilterCategory] = useState('all');

      // Load Continue Watching from localStorage
      useEffect(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('flex_continue_watching') || '[]');
          setContinueWatching(saved);
        } catch (e) {}
      }, []);

      const filteredItems = feed.filter((item) => {
        if (filterCategory === 'movies') return item.media_type === 'movie';
        if (filterCategory === 'tv') return item.media_type === 'tv';
        return true;
      });

      const handlePlayPress = (media) => {
        const itemToPlay = {
          ...media,
          title: media.title || media.name,
          season: media.media_type === 'tv' ? selectedSeason : undefined,
          episode: media.media_type === 'tv' ? selectedEpisode : undefined
        };

        // Save into Continue Watching
        try {
          const currentList = JSON.parse(localStorage.getItem('flex_continue_watching') || '[]');
          const updated = [itemToPlay, ...currentList.filter((x) => x.id !== itemToPlay.id)].slice(0, 8);
          localStorage.setItem('flex_continue_watching', JSON.stringify(updated));
          setContinueWatching(updated);
        } catch (e) {}

        setActiveDetail(null);
        onSelectMedia(itemToPlay);
      };

      return (
        <div className="space-y-5 pb-6">
          {/* Category Filter Pills */}
          <div className="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
            {[
              { id: 'all', label: 'All Feeds' },
              { id: 'movies', label: 'Movies' },
              { id: 'tv', label: 'TV Series' }
            ].map((cat) => (
              <button
                key={cat.id}
                onClick={() => setFilterCategory(cat.id)}
                className={`text-xs px-3.5 py-1.5 rounded-full font-medium transition ${
                  filterCategory === cat.id
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                    : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200'
                }`}
              >
                {cat.label}
              </button>
            ))}
          </div>

          {/* Continue Watching Section */}
          {continueWatching.length > 0 && (
            <div className="space-y-2">
              <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Continue Watching</h3>
              <div className="flex space-x-3 overflow-x-auto pb-2 scrollbar-none">
                {continueWatching.map((item, idx) => (
                  <div
                    key={idx}
                    onClick={() => handlePlayPress(item)}
                    className="flex-shrink-0 w-32 bg-slate-900 border border-slate-800/80 rounded-xl overflow-hidden active:scale-95 transition cursor-pointer"
                  >
                    <div className="h-20 bg-slate-800 relative">
                      <img
                        src={item.backdrop_path ? `${TMDB_IMAGE_BASE}${item.backdrop_path}` : `${TMDB_IMAGE_BASE}${item.poster_path}`}
                        alt={item.title}
                        className="w-full h-full object-cover"
                        loading="lazy"
                      />
                      <div className="absolute inset-0 bg-black/40 flex items-center justify-center">
                        <span className="text-xl">▶</span>
                      </div>
                    </div>
                    <div className="p-2">
                      <p className="text-[11px] font-semibold text-white truncate">{item.title}</p>
                      {item.season && (
                        <p className="text-[9px] text-indigo-400">S{item.season} : E{item.episode}</p>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Main Feed Grid */}
          <div className="space-y-2">
            <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Trending & Recommended</h3>
            <div className="grid grid-cols-2 gap-3">
              {filteredItems.map((item) => (
                <div
                  key={item.id}
                  onClick={() => setActiveDetail(item)}
                  className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col active:scale-98 transition cursor-pointer shadow-sm hover:border-slate-700"
                >
                  <div className="aspect-[2/3] bg-slate-800 relative">
                    <img
                      src={`${TMDB_IMAGE_BASE}${item.poster_path}`}
                      alt={item.title || item.name}
                      className="w-full h-full object-cover"
                      loading="lazy"
                    />
                    <div className="absolute top-2 right-2 bg-black/70 backdrop-blur-sm text-amber-400 text-[10px] px-1.5 py-0.5 rounded-md font-bold flex items-center space-x-1">
                      <span>★</span>
                      <span>{item.vote_average?.toFixed(1)}</span>
                    </div>
                  </div>
                  <div className="p-2.5 flex-1 flex flex-col justify-between">
                    <div>
                      <h4 className="text-xs font-semibold text-white line-clamp-1">{item.title || item.name}</h4>
                      <p className="text-[10px] text-slate-400 mt-0.5">
                        {item.release_date?.slice(0, 4)} • {item.media_type === 'tv' ? 'Series' : 'Movie'}
                      </p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Deep Metadata Sheet / Modal */}
          {activeDetail && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col justify-end p-0">
              <div className="bg-slate-900 border-t border-slate-800 rounded-t-3xl max-h-[88vh] overflow-y-auto p-5 space-y-4">
                <div className="flex justify-between items-start">
                  <div>
                    <h2 className="text-lg font-bold text-white">{activeDetail.title || activeDetail.name}</h2>
                    <p className="text-xs text-slate-400">
                      {activeDetail.release_date?.slice(0, 4)} • Rating: ★ {activeDetail.vote_average?.toFixed(1)}
                    </p>
                  </div>
                  <button
                    onClick={() => setActiveDetail(null)}
                    className="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>

                {/* Backdrop Banner */}
                {activeDetail.backdrop_path && (
                  <div className="w-full h-36 rounded-xl overflow-hidden bg-slate-800">
                    <img
                      src={`${TMDB_IMAGE_BASE}${activeDetail.backdrop_path}`}
                      className="w-full h-full object-cover"
                      alt="Backdrop"
                    />
                  </div>
                )}

                {/* Synopsis */}
                <p className="text-xs text-slate-300 leading-relaxed">{activeDetail.overview}</p>

                {/* Cast */}
                {activeDetail.cast && (
                  <div className="space-y-1">
                    <span className="text-[11px] font-semibold text-slate-400 uppercase">Cast</span>
                    <p className="text-xs text-indigo-300">{activeDetail.cast.join(', ')}</p>
                  </div>
                )}

                {/* Season & Episode Picker for TV */}
                {activeDetail.media_type === 'tv' && (
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div className="text-xs font-semibold text-slate-300">Episodes & Seasons</div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">Season</label>
                        <select
                          value={selectedSeason}
                          onChange={(e) => setSelectedSeason(Number(e.target.value))}
                          className="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg p-2"
                        >
                          {Array.from({ length: activeDetail.seasonsCount || 4 }, (_, i) => i + 1).map((s) => (
                            <option key={s} value={s}>Season {s}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">Episode</label>
                        <select
                          value={selectedEpisode}
                          onChange={(e) => setSelectedEpisode(Number(e.target.value))}
                          className="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg p-2"
                        >
                          {Array.from({ length: 12 }, (_, i) => i + 1).map((ep) => (
                            <option key={ep} value={ep}>Episode {ep}</option>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>
                )}

                {/* Action Buttons */}
                <div className="pt-2">
                  <button
                    onClick={() => handlePlayPress(activeDetail)}
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-98 font-bold text-white text-sm rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2"
                  >
                    <span>▶ Play Stream</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    /* ========================================================
       PLACEHOLDER 4: SEARCH VIEW
       ======================================================== */
    function SearchView({ onSelectMedia }) {
      const [query, setQuery] = useState('');
      const [selectedType, setSelectedType] = useState('all');
      const [selectedGenre, setSelectedGenre] = useState('all');
      const [showFilters, setShowFilters] = useState(false);

      const imgBase = 'https://image.tmdb.org/t/p/w500';

      const searchLibrary = [
        {
          id: 603,
          title: 'The Matrix',
          media_type: 'movie',
          poster_path: '/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg',
          vote_average: 8.2,
          year: 1999,
          genre: 'Sci-Fi'
        },
        {
          id: 157336,
          title: 'Interstellar',
          media_type: 'movie',
          poster_path: '/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg',
          vote_average: 8.4,
          year: 2014,
          genre: 'Sci-Fi'
        },
        {
          id: 1399,
          title: 'Game of Thrones',
          media_type: 'tv',
          poster_path: '/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg',
          vote_average: 8.4,
          year: 2011,
          genre: 'Drama'
        },
        {
          id: 66732,
          title: 'Stranger Things',
          media_type: 'tv',
          poster_path: '/49WJfeN0moxb9IPfGn8AIqMGskD.jpg',
          vote_average: 8.6,
          year: 2016,
          genre: 'Mystery'
        }
      ];

      const results = searchLibrary.filter((item) => {
        const matchesQuery = !query.trim() || item.title.toLowerCase().includes(query.toLowerCase());
        const matchesType = selectedType === 'all' || item.media_type === selectedType;
        const matchesGenre = selectedGenre === 'all' || item.genre === selectedGenre;
        return matchesQuery && matchesType && matchesGenre;
      });

      return (
        <div className="space-y-4 pb-6">
          <div className="space-y-2">
            <div className="relative flex items-center">
              <input
                type="text"
                placeholder="Search movies, TV shows..."
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-4 pr-10 text-xs text-white placeholder-slate-500 focus:outline-none"
              />
              {query && (
                <button
                  onClick={() => setQuery('')}
                  className="absolute right-3 text-slate-500 text-xs font-bold"
                >
                  X
                </button>
              )}
            </div>

            <div className="flex justify-between items-center px-1">
              <button
                onClick={() => setShowFilters(!showFilters)}
                className="text-xs text-indigo-400 font-medium"
              >
                Filters {showFilters ? '[-]' : '[+]'}
              </button>
              <span className="text-[10px] text-slate-500">{results.length} found</span>
            </div>
          </div>

          {showFilters && (
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-3">
              <div>
                <label className="text-[10px] text-slate-400 block mb-1">TYPE</label>
                <div className="flex space-x-2">
                  {['all', 'movie', 'tv'].map((t) => (
                    <button
                      key={t}
                      onClick={() => setSelectedType(t)}
                      className={`text-[11px] px-3 py-1 rounded-lg border ${
                        selectedType === t
                          ? 'bg-indigo-600/30 border-indigo-500 text-indigo-300'
                          : 'bg-slate-950 border-slate-800 text-slate-400'
                      }`}
                    >
                      {t.toUpperCase()}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-[10px] text-slate-400 block mb-1">GENRE</label>
                <select
                  value={selectedGenre}
                  onChange={(e) => setSelectedGenre(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 text-xs text-slate-300 rounded-lg p-2"
                >
                  <option value="all">All Genres</option>
                  <option value="Sci-Fi">Sci-Fi</option>
                  <option value="Drama">Drama</option>
                  <option value="Mystery">Mystery</option>
                </select>
              </div>
            </div>
          )}

          <div className="space-y-2">
            {results.map((item) => (
              <div
                key={item.id}
                onClick={() => onSelectMedia(item)}
                className="flex bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-x-3 items-center cursor-pointer"
              >
                <img
                  src={imgBase + item.poster_path}
                  alt={item.title}
                  className="w-12 h-16 bg-slate-800 rounded-lg object-cover"
                />
                <div className="flex-1 min-w-0">
                  <h4 className="text-xs font-bold text-white truncate">{item.title}</h4>
                  <p className="text-[10px] text-slate-400 mt-0.5">{item.year} - {item.genre}</p>
                  <span className="text-[10px] text-amber-400">Rating: {item.vote_average}</span>
                </div>
                <span className="text-indigo-400 text-sm font-bold">Play</span>
              </div>
            ))}
          </div>
        </div>
      );
    }


    /* ========================================================
       PLACEHOLDER 5: STREAM SNIFFER & PLAYER VIEW
       ======================================================== */
    function PlayerModal({ activeMedia, onClose }) {
      if (!activeMedia) return null;

      // Sample stream sources simulating failover queue
      const sampleSources = [
        { name: 'Provider 1 (HLS Stream)', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', type: 'hls' },
        { name: 'Provider 2 (Direct MP4)', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', type: 'mp4' },
        { name: 'Provider 3 (Backup Mirror)', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', type: 'mp4' }
      ];

      const [selectedSourceIdx, setSelectedSourceIdx] = useState(0);
      const [isResolving, setIsResolving] = useState(false);
      const [snifferUrl, setSnifferUrl] = useState('');
      const [sniffedStream, setSniffedStream] = useState(null);
      const [showSniffer, setShowSniffer] = useState(false);
      const [streamError, setStreamError] = useState(null);

      const currentSource = sampleSources[selectedSourceIdx];
      const isNative = Bridge.isNative();

      const handlePlayNative = (targetUrl) => {
        setStreamError(null);
        const urlToPlay = targetUrl || currentSource.url;
        const success = Bridge.playStream({
          url: urlToPlay,
          userAgent: 'FlexExoPlayer/2.0',
          headers: { Referer: 'https://flexmedia.internal' },
          subtitleUrl: '',
          startPositionMs: 0
        });

        if (!success) {
          console.log('Web fallback: playing via HTML5 video player.');
        }
      };

      const handleDownloadCurrent = (targetUrl) => {
        const urlToDl = targetUrl || currentSource.url;
        const cleanTitle = (activeMedia.title || 'media').replace(/[^a-zA-Z0-9]/g, '_');
        Bridge.startDownload({
          url: urlToDl,

    /* ========================================================
       PLACEHOLDER 6: DOWNLOADS VIEW
       ======================================================== */
    function DownloadsView({ downloadEvents }) {
      const [customUrl, setCustomUrl] = useState('');
      const [customName, setCustomName] = useState('');
      const [showNewDownload, setShowNewDownload] = useState(false);

      const tasksMap = (downloadEvents && downloadEvents.tasks) || {};
      const taskList = Object.values(tasksMap);

      const activeCount = taskList.filter((t) => t.status === 'downloading').length;
      const completedCount = taskList.filter((t) => t.status === 'completed').length;
      const errorCount = taskList.filter((t) => t.status === 'error').length;

      const handleStartCustomDownload = (e) => {
        e.preventDefault();
        if (!customUrl.trim()) return;

        const fileName = customName.trim() || 'media_' + Date.now() + '.mp4';
        Bridge.startDownload({
          url: customUrl.trim(),
          fileName: fileName
        });

        setCustomUrl('');
        setCustomName('');
        setShowNewDownload(false);
      };

      const formatBytes = (bytes) => {
        if (!bytes || bytes === 0) return '0 MB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      };

      const formatEta = (seconds) => {
        if (!seconds || seconds <= 0) return '--';
        if (seconds > 60) {
          const mins = Math.floor(seconds / 60);
          return mins + 'm ' + (seconds % 60) + 's';
        }
        return seconds + 's';
      };

      return (
        <div className="space-y-4 pb-6">
          {/* Header & Quick Dispatch Toggle */}
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-sm font-bold text-white">Download Manager</h2>
              <p className="text-[10px] text-slate-400">Android Foreground Service Monitor</p>
            </div>
            <button
              onClick={() => setShowNewDownload(!showNewDownload)}
              className="text-xs px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 font-semibold text-white rounded-lg shadow"
            >
              {showNewDownload ? 'Cancel' : '+ New URL'}
            </button>
          </div>

          {/* Quick Metrics Bar */}
          <div className="grid grid-cols-3 gap-2 text-center text-xs">
            <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
              <span className="text-[10px] text-slate-400 block">Active</span>
              <span className="font-bold text-indigo-400 text-sm">{activeCount}</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
              <span className="text-[10px] text-slate-400 block">Finished</span>
              <span className="font-bold text-emerald-400 text-sm">{completedCount}</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
              <span className="text-[10px] text-slate-400 block">Errors</span>
              <span className="font-bold text-rose-400 text-sm">{errorCount}</span>
            </div>
          </div>

          {/* Custom URL Dispatch Form */}
          {showNewDownload && (
            <form onSubmit={handleStartCustomDownload} className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
              <h4 className="text-xs font-semibold text-slate-200">Start Direct Download</h4>
              <input
                type="text"
                placeholder="Video direct link (.mp4, .m3u8)"
                value={customUrl}
                onChange={(e) => setCustomUrl(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500"
              />
              <input
                type="text"
                placeholder="File name (e.g. Movie.mp4)"
                value={customName}
                onChange={(e) => setCustomName(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500"
              />
              <button
                type="submit"
                className="w-full py-2 bg-indigo-600 font-bold text-xs text-white rounded-lg"
              >
                Dispatch to Shell Downloader
              </button>
            </form>
          )}

          {/* Active Queue List */}
          <div className="space-y-2.5">
            <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Queue & History</h3>

            {taskList.length === 0 ? (
              <div className="bg-slate-900/50 border border-slate-800/60 rounded-xl p-8 text-center text-xs text-slate-500">
                No active or queued downloads.
              </div>
            ) : (
              taskList.map((task) => (
                <div key={task.fileName} className="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2">
                  <div className="flex justify-between items-start">
                    <div className="truncate flex-1 mr-2">
                      <p className="text-xs font-semibold text-white truncate">{task.fileName}</p>
                      <span className="text-[10px] text-slate-400">
                        {formatBytes(task.bytesCopied)} / {formatBytes(task.totalBytes)}
                      </span>
                    </div>

                    {/* Status Badge */}
                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${
                      task.status === 'completed'
                        ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                        : task.status === 'error'
                        ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30'
                        : 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30'
                    }`}>
                      {task.status}
                    </span>
                  </div>

                  {/* Progress Bar */}
                  <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                    <div
                      className={`h-full transition-all duration-300 ${
                        task.status === 'completed'
                          ? 'bg-emerald-500'
                          : task.status === 'error'
                          ? 'bg-rose-500'
                          : 'bg-indigo-600'
                      }`}
                      style={{ width: (task.progress || 0) + '%' }}
                    />
                  </div>

                  {/* Live Statistics: Speed, ETA, Percentage */}
                  <div className="flex justify-between items-center text-[10px] text-slate-400">
                    <span>{task.progress || 0}%</span>
                    {task.status === 'downloading' && (
                      <span>Speed: {task.speed || 0} MB/s • ETA: {formatEta(task.eta)}</span>
                    )}
                    {task.status === 'error' && (
                      <span className="text-rose-400">{task.error || 'Failed'}</span>
                    )}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

       END PLACEHOLDER 6

    /* ========================================================
       PLACEHOLDER 7: LOCAL HUB VIEW
       ======================================================== */
    function LocalHubView() {
      const [files, setFiles] = useState([]);
      const [isLoading, setIsLoading] = useState(false);

      // Offline sample files for testing when in browser mode
      const browserMockFiles = [
        {
          name: 'The.Matrix.1999.mp4',
          size: 1572864000, // ~1.5 GB
          localPath: '/Download/FlexMedia/The.Matrix.1999.mp4',
          url: 'http://127.0.0.1:8080/media/The.Matrix.1999.mp4'
        },
        {
          name: 'Stranger.Things.S01E01.mp4',
          size: 786432000, // ~750 MB
          localPath: '/Download/FlexMedia/Stranger.Things.S01E01.mp4',
          url: 'http://127.0.0.1:8080/media/Stranger.Things.S01E01.mp4'
        }
      ];

      // Regex metadata parser engine
      const parseMediaName = (fileName) => {
        // Test TV series pattern: Title.S01E01
        const tvMatch = fileName.match(/(.*?)[._\s]+[sS](\d{1,2})[eE](\d{1,2})/i);
        if (tvMatch) {
          return {
            cleanTitle: tvMatch[1].replace(/\./g, ' '),
            season: parseInt(tvMatch[2], 10),
            episode: parseInt(tvMatch[3], 10),
            isSeries: true
          };
        }

        // Test movie with year pattern: Title.2024
        const movieMatch = fileName.match(/(.*?)[._\s]+(\d{4})/);
        if (movieMatch) {
          return {
            cleanTitle: movieMatch[1].replace(/\./g, ' '),
            year: movieMatch[2],
            isSeries: false
          };
        }

        // Default fallback
        return {
          cleanTitle: fileName.replace(/\.[^/.]+$/, '').replace(/[._]/g, ' '),
          isSeries: false
        };
      };

      const loadFiles = () => {
        setIsLoading(true);
        if (Bridge.isNative()) {
          const list = Bridge.getLocalMediaFiles();
          setFiles(Array.isArray(list) ? list : []);
        } else {
          // Fallback demo files in browser
          setFiles(browserMockFiles);
        }
        setIsLoading(false);
      };

      useEffect(() => {
        loadFiles();
      }, []);

      const formatSize = (bytes) => {
        if (!bytes) return '0 MB';
        const mb = bytes / (1024 * 1024);
        if (mb >= 1024) {
          return (mb / 1024).toFixed(2) + ' GB';
        }
        return mb.toFixed(0) + ' MB';
      };

      const totalStorageBytes = files.reduce((acc, f) => acc + (f.size || 0), 0);

      const handlePlayLocal = (file) => {
        const streamUrl = file.url || ('http://127.0.0.1:8080/media/' + encodeURIComponent(file.name));
        Bridge.playStream({
          url: streamUrl,
          userAgent: 'FlexLoopbackClient/1.0',
          headers: {},
          subtitleUrl: '',
          startPositionMs: 0
        });
      };

      const handleDelete = (file) => {
        if (confirm('Delete ' + file.name + ' from storage?')) {
          Bridge.deleteFile(file.localPath);
          setFiles((prev) => prev.filter((f) => f.localPath !== file.localPath));
        }
      };

      return (
        <div className="space-y-4 pb-6">
          {/* Header */}
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-sm font-bold text-white">Local Media Hub</h2>
              <p className="text-[10px] text-slate-400">Offline Directory: /Download/FlexMedia/</p>
            </div>
            <button
              onClick={loadFiles}
              className="text-xs px-2.5 py-1.5 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 font-medium"
            >
              Refresh
            </button>
          </div>

          {/* Storage Meter Card */}
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <div className="flex justify-between items-center text-xs">
              <span className="text-slate-400">Offline Storage Used</span>
              <span className="font-bold text-indigo-400">{formatSize(totalStorageBytes)}</span>
            </div>
            <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
              <div className="bg-indigo-500 h-full w-1/4 rounded-full" />
            </div>
            <p className="text-[10px] text-slate-500">{files.length} media files stored locally</p>
          </div>

          {/* Scanned Local Media List */}
          <div className="space-y-2">
            <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Saved Recordings & Files</h3>

            {files.length === 0 ? (
              <div className="bg-slate-900/50 border border-slate-800/60 rounded-xl p-8 text-center text-xs text-slate-500">
                No local media found in /Download/FlexMedia/
              </div>
            ) : (
              files.map((file, idx) => {
                const meta = parseMediaName(file.name);
                return (
                  <div
                    key={file.localPath || idx}
                    className="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2.5"
                  >
                    <div className="flex justify-between items-start">
                      <div className="truncate flex-1 mr-2">
                        <h4 className="text-xs font-bold text-white truncate capitalize">{meta.cleanTitle}</h4>
                        <div className="flex items-center space-x-2 mt-0.5 text-[10px] text-slate-400">
                          {meta.isSeries && (
                            <span className="text-indigo-400 font-semibold">
                              S{meta.season} : E{meta.episode}
                            </span>
                          )}
                          {meta.year && <span>{meta.year}</span>}
                          <span>Size: {formatSize(file.size)}</span>
                        </div>
                      </div>
                      <button
                        onClick={() => handleDelete(file)}
                        className="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 bg-rose-950/30 border border-rose-900/50 rounded-lg"
                      >
                        Delete
                      </button>
                    </div>

                    <div className="flex justify-between items-center pt-1 border-t border-slate-800/60">
                      <span className="text-[9px] text-slate-500 font-mono truncate max-w-[180px]">
                        127.0.0.1:8080/media/{file.name}
                      </span>
                      <button
                        onClick={() => handlePlayLocal(file)}
                        className="text-xs px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold"
                      >
                        Play Offline
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

       END PLACEHOLDER 7
       ======================================================== */

            <button
              onClick={() => Bridge.minimizeApp()}
              className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 text-center"
            >
              Minimize Application to Background
            </button>

            <button
              onClick={handleClearHistory}
              className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 text-center"
            >
              Clear Continue Watching History
            </button>

            <button
              onClick={handleClearCache}
              className="w-full py-2.5 bg-rose-950/40 hover:bg-rose-900/40 text-rose-300 text-xs font-semibold rounded-lg border border-rose-800/50 text-center"
            >
              Flush WebView Cache & Scraper Tokens
            </button>
          </div>
        </div>
      );
    }
    /* ========================================================
       END PLACEHOLDER 8
       ======================================================== */


    // --- MAIN APP SHELL & ROUTER ---
    function App() {
      const [currentTab, setCurrentTab] = useState('catalog');
      const [capabilities, setCapabilities] = useState(null);
      const [activeMedia, setActiveMedia] = useState(null);

      /* ========================================================
         PLACEHOLDER 2: NATIVE EVENTS STATE
         ======================================================== */
      const [downloadTasks, setDownloadTasks] = useState({});
      const [playbackError, setPlaybackError] = useState(null);
      const [recentEventLogs, setRecentEventLogs] = useState([]);

      useEffect(() => {
        // Read shell capabilities
        setCapabilities(Bridge.getCapabilities());

        // 1. Download Progress Handler (Calculates Speed & ETA)
        const handleDownloadProgress = (e) => {
          const detail = e.detail || {};
          const { fileName, progress = 0, bytesCopied = 0, totalBytes = 0 } = detail;
          if (!fileName) return;

          setDownloadTasks((prev) => {
            const prevTask = prev[fileName] || {};
            const now = Date.now();
            const timeDiffSec = prevTask.lastTimestamp ? (now - prevTask.lastTimestamp) / 1000 : 1;
            const bytesDiff = prevTask.bytesCopied ? bytesCopied - prevTask.bytesCopied : 0;

            // Speed in MB/s
            const speedMbps = timeDiffSec > 0 && bytesDiff > 0 ? (bytesDiff / (1024 * 1024)) / timeDiffSec : prevTask.speed || 0;
            // ETA in seconds
            const remainingBytes = Math.max(0, totalBytes - bytesCopied);
            const etaSeconds = speedMbps > 0 ? Math.round(remainingBytes / (speedMbps * 1024 * 1024)) : null;

            return {
              ...prev,
              [fileName]: {
                fileName,
                progress: Math.min(100, Math.round(progress)),
                bytesCopied,
                totalBytes,
                speed: parseFloat(speedMbps.toFixed(2)),
                eta: etaSeconds,
                status: 'downloading',
                lastTimestamp: now
              }
            };
          });

          setRecentEventLogs((logs) => [
            { type: 'downloadProgress', file: fileName, progress: `${Math.round(progress)}%`, time: new Date().toLocaleTimeString() },
            ...logs.slice(0, 15)
          ]);
        };

        // 2. Download Complete Handler
        const handleDownloadComplete = (e) => {
          const detail = e.detail || {};
          const fileName = detail.fileName;
          if (!fileName) return;

          setDownloadTasks((prev) => ({
            ...prev,
            [fileName]: {
              ...(prev[fileName] || { fileName, totalBytes: 0, bytesCopied: 0 }),
              progress: 100,
              speed: 0,
              eta: 0,
              status: 'completed'
            }
          }));

          setRecentEventLogs((logs) => [
            { type: 'downloadComplete', file: fileName, time: new Date().toLocaleTimeString() },
            ...logs.slice(0, 15)
          ]);
        };

        // 3. Download Error Handler
        const handleDownloadError = (e) => {
          const detail = e.detail || {};
          const { fileName, error = 'Download failed' } = detail;
          if (!fileName) return;

          setDownloadTasks((prev) => ({
            ...prev,
            [fileName]: {
              ...(prev[fileName] || { fileName }),
              status: 'error',
              error
            }
          }));

          setRecentEventLogs((logs) => [
            { type: 'downloadError', file: fileName, error, time: new Date().toLocaleTimeString() },
            ...logs.slice(0, 15)
          ]);
        };

        // 4. ExoPlayer Crash / Playback Error Handler
        const handlePlaybackError = (e) => {
          const detail = e.detail || {};
          console.error('Native ExoPlayer Error Received:', detail);
          setPlaybackError(detail.error || 'Playback halted unexpectedly');

          setRecentEventLogs((logs) => [
            { type: 'ON_PLAYBACK_ERROR', error: detail.error || 'Playback error', time: new Date().toLocaleTimeString() },
            ...logs.slice(0, 15)
          ]);
        };

        window.addEventListener('downloadProgress', handleDownloadProgress);
        window.addEventListener('downloadComplete', handleDownloadComplete);
        window.addEventListener('downloadError', handleDownloadError);
        window.addEventListener('ON_PLAYBACK_ERROR', handlePlaybackError);

        return () => {
          window.removeEventListener('downloadProgress', handleDownloadProgress);
          window.removeEventListener('downloadComplete', handleDownloadComplete);
          window.removeEventListener('downloadError', handleDownloadError);
          window.removeEventListener('ON_PLAYBACK_ERROR', handlePlaybackError);
        };
      }, []);

      // Provide active tasks to downloads view
      const downloadEvents = { tasks: downloadTasks, logs: recentEventLogs };
      /* ========================================================
         END PLACEHOLDER 2
         ======================================================== */

      // Hardware back button router
      useEffect(() => {
        if (!window.history.state) {
          window.history.replaceState({ tab: 'catalog' }, '');
        }
        const handlePop = (e) => {
          if (activeMedia) {
            setActiveMedia(null);
            return;
          }
          if (e.state && e.state.tab) {
            setCurrentTab(e.state.tab);
          } else {
            Bridge.minimizeApp();
          }
        };
        window.addEventListener('popstate', handlePop);
        return () => window.removeEventListener('popstate', handlePop);
      }, [activeMedia]);

      const navigateTo = (tab) => {
        if (tab === currentTab) return;
        window.history.pushState({ tab }, '');
        setCurrentTab(tab);
      };

      const tabs = [
        { id: 'catalog', label: 'Catalog', icon: '🎬' },
        { id: 'search', label: 'Search', icon: '🔍' },
        { id: 'downloads', label: 'Downloads', icon: '📥' },
        { id: 'storage', label: 'Local Hub', icon: '📁' },
        { id: 'settings', label: 'Settings', icon: '⚙️' }
      ];

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col p-4">
          {/* Top Bar */}
          <header className="flex items-center justify-between pb-3 border-b border-slate-800/80 mb-4">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-base">
                F
              </div>
              <h1 className="text-base font-bold text-white tracking-wide">FLEX</h1>
            </div>
            <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-medium ${
              Bridge.isNative() ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'
            }`}>
              {Bridge.isNative() ? 'Native Shell' : 'Browser Mode'}
            </span>
          </header>

          {/* Screen Container */}
          <main className="flex-1">
            {currentTab === 'catalog' && <CatalogView onSelectMedia={setActiveMedia} />}
            {currentTab === 'search' && <SearchView onSelectMedia={setActiveMedia} />}
            {currentTab === 'downloads' && <DownloadsView downloadEvents={downloadEvents} />}
            {currentTab === 'storage' && <LocalHubView />}
            {currentTab === 'settings' && <SettingsView capabilities={capabilities} />}
          </main>

          {/* Player Modal Overlay */}
          <PlayerModal activeMedia={activeMedia} onClose={() => setActiveMedia(null)} />

          {/* Bottom Bar */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/80 px-2 py-1.5 pb-[calc(env(safe-area-inset-bottom,0px)+6px)] flex justify-around">
            {tabs.map((tab) => (
              <button
                key={tab.id}
                onClick={() => navigateTo(tab.id)}
                className={`flex flex-col items-center flex-1 py-1 transition ${
                  currentTab === tab.id ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-lg">{tab.icon}</span>
                <span className="text-[10px] mt-0.5">{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
